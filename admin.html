<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Family Flashcards — Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <script src="admin.js" defer></script>
  </head>
  <body>
    <div id="app">
      <div class="screen login-screen active" id="login-screen"></div>
      <div class="screen people-screen" id="people-screen"></div>
      <div class="screen person-screen" id="person-screen"></div>
      <div class="screen picker-screen" id="picker-screen"></div>
      <div class="screen error-screen" id="error-screen"></div>
    </div>
    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="overlay-content">
        <div class="spinner"></div>
        <p class="overlay-text" id="overlay-text">Working…</p>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </body>
</html>
