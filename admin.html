<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Family Flashcards — Admin</title>
    <script>
      // See comment in index.html. Propagates ?cb=... to asset URLs and
      // waits for DOMContentLoaded before loading admin.js (dynamic scripts
      // ignore defer and can otherwise run before the screen divs exist).
      (function () {
        var cb = new URLSearchParams(location.search).get("cb");
        var suf = cb ? "?cb=" + cb : "";
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = "admin.css" + suf;
        document.head.appendChild(l);
        function loadScripts() {
          var s = document.createElement("script");
          s.src = "admin.js" + suf;
          document.head.appendChild(s);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", loadScripts);
        } else {
          loadScripts();
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="screen login-screen active" id="login-screen"></div>
      <div class="screen people-screen" id="people-screen"></div>
      <div class="screen person-screen" id="person-screen"></div>
      <div class="screen picker-screen" id="picker-screen"></div>
      <div class="screen error-screen" id="error-screen"></div>
    </div>
    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="overlay-content">
        <div class="spinner"></div>
        <p class="overlay-text" id="overlay-text">Working…</p>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </body>
</html>
