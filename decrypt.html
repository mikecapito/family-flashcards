<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Family Flashcards — Decrypt</title>
    <script>
      (function () {
        var cb = new URLSearchParams(location.search).get("cb");
        var suf = cb ? "?cb=" + cb : "";
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = "styles.css" + suf;
        document.head.appendChild(l);
        var d = document.createElement("link");
        d.rel = "stylesheet";
        d.href = "decrypt.css" + suf;
        document.head.appendChild(d);
        function loadScripts() {
          var s = document.createElement("script");
          s.src = "decrypt.js" + suf;
          s.async = false;
          document.head.appendChild(s);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", loadScripts);
        } else {
          loadScripts();
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="screen decrypt-screen active">
        <div class="decrypt-container">
          <h1 class="family-name">Decrypt backup</h1>
          <p class="subheading">
            Recover the plaintext JSON from an encrypted family file. Runs
            entirely in your browser — nothing is sent anywhere.
          </p>

          <form id="decrypt-form" class="password-form">
            <label class="field-label" for="env-url">Encrypted file URL</label>
            <input
              type="url"
              id="env-url"
              class="password-input text-input"
              placeholder="https://example.com/path/family.enc.json"
              autocomplete="off"
              spellcheck="false"
            />

            <p class="or-divider">— or —</p>

            <label class="field-label" for="env-file">Upload .enc.json file</label>
            <input type="file" id="env-file" accept=".json,application/json" />

            <label class="field-label" for="pw">Family password</label>
            <input
              type="password"
              id="pw"
              class="password-input"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />

            <button type="submit" id="decrypt-btn" class="btn-primary">Decrypt</button>
          </form>

          <p class="error-message" id="decrypt-error"></p>

          <div id="result" class="decrypt-result" hidden>
            <div class="result-header">
              <span>Decrypted JSON</span>
              <button type="button" id="download-btn" class="btn-secondary">
                Download plaintext JSON
              </button>
            </div>
            <pre id="json-out" class="json-out"></pre>
          </div>

          <p class="back-row">
            <a href="./">← Family app</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
