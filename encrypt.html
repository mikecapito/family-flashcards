<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Family Flashcards — Data Encryption Tool</title>
    <style>
      :root {
        --accent: #d97706;
        --accent-text: #ffffff;
        --bg: #fbf7f1;
        --card-bg: #ffffff;
        --text: #1f2937;
        --text-muted: #6b7280;
        --border: #e5e7eb;
        --danger: #b91c1c;
        --success: #16a34a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        color: var(--accent);
      }
      .intro {
        font-size: 15px;
        color: var(--text-muted);
        margin: 0 0 24px;
        line-height: 1.5;
      }
      .field {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
      }
      .field label {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      textarea, input {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card-bg);
        color: var(--text);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }
      textarea {
        min-height: 220px;
        resize: vertical;
        line-height: 1.4;
      }
      input[type="password"] {
        font-family: inherit;
        font-size: 16px;
      }
      textarea:focus, input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
      }
      textarea[readonly] {
        background: #f9fafb;
        color: var(--text-muted);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .row .field { flex: 1 1 240px; }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      button {
        min-height: 44px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--accent);
        color: var(--accent-text);
      }
      .btn-secondary {
        background: transparent;
        color: var(--accent);
        border: 2px solid var(--accent);
      }
      button:disabled {
        cursor: progress;
        opacity: 0.7;
      }
      .status {
        min-height: 1.4em;
        margin: 12px 0 0;
        font-size: 14px;
        font-weight: 500;
      }
      .status.error { color: var(--danger); }
      .status.success { color: var(--success); }
      .output-section {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }
      .output-section.hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Family Flashcards — Data Encryption Tool</h1>
      <p class="intro">
        This tool encrypts your family's data so it can be safely stored in a
        public GitHub repo. Everything happens in your browser — nothing is
        uploaded anywhere. Save this page locally and run it offline if you
        want to be extra cautious.
      </p>

      <div class="field">
        <label for="plaintext">Plaintext JSON</label>
        <textarea id="plaintext" spellcheck="false" placeholder='{
  "familyName": "The Frist Family Reunion 2026",
  "ancestor": "eleanor-frist",
  "people": [ ... ]
}'></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="password">Family password</label>
          <input id="password" type="password" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password-confirm">Confirm password</label>
          <input id="password-confirm" type="password" autocomplete="new-password" />
        </div>
      </div>

      <div class="actions">
        <button id="encrypt-btn" type="button" class="btn-primary">Encrypt</button>
      </div>

      <p id="status" class="status"></p>

      <div id="output-section" class="output-section hidden">
        <div class="field">
          <label for="output">Encrypted data.enc.json</label>
          <textarea id="output" readonly spellcheck="false"></textarea>
        </div>
        <div class="actions">
          <button id="download-btn" type="button" class="btn-primary">Download data.enc.json</button>
          <button id="copy-btn" type="button" class="btn-secondary">Copy to clipboard</button>
        </div>
        <p id="output-status" class="status"></p>
      </div>
    </div>

    <script>
      // PBKDF2 parameters — must match what the app expects on decrypt.
      const KDF_ITERATIONS = 600000;
      const SALT_BYTES = 16;
      const IV_BYTES = 12;

      const $ = id => document.getElementById(id);

      function bytesToBase64(bytes) {
        let binary = "";
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      async function deriveKey(password, salt) {
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: KDF_ITERATIONS, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt"]
        );
      }

      async function encrypt(plaintextJsonString, password) {
        const salt = crypto.getRandomValues(new Uint8Array(SALT_BYTES));
        const iv = crypto.getRandomValues(new Uint8Array(IV_BYTES));
        const key = await deriveKey(password, salt);
        const ciphertextBuf = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          key,
          new TextEncoder().encode(plaintextJsonString)
        );
        return {
          version: 1,
          kdf: "PBKDF2-SHA256",
          iterations: KDF_ITERATIONS,
          salt: bytesToBase64(salt),
          iv: bytesToBase64(iv),
          ciphertext: bytesToBase64(new Uint8Array(ciphertextBuf))
        };
      }

      function setStatus(el, msg, kind) {
        el.textContent = msg;
        el.classList.remove("error", "success");
        if (kind) el.classList.add(kind);
      }

      $("encrypt-btn").addEventListener("click", async () => {
        const status = $("status");
        const outputSection = $("output-section");
        const output = $("output");
        const btn = $("encrypt-btn");

        setStatus(status, "");
        outputSection.classList.add("hidden");
        output.value = "";

        const plaintextRaw = $("plaintext").value.trim();
        const password = $("password").value;
        const confirm = $("password-confirm").value;

        if (!plaintextRaw) {
          setStatus(status, "Paste the plaintext JSON before encrypting.", "error");
          return;
        }
        let parsed;
        try {
          parsed = JSON.parse(plaintextRaw);
        } catch (e) {
          setStatus(status, "Plaintext is not valid JSON: " + e.message, "error");
          return;
        }
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          setStatus(status, "Plaintext JSON must be an object with ancestor and people fields.", "error");
          return;
        }
        if (
          typeof parsed.familyName !== "string" ||
          typeof parsed.ancestor !== "string" ||
          !Array.isArray(parsed.people)
        ) {
          setStatus(status, "Plaintext JSON must include a 'familyName' string, an 'ancestor' string, and a 'people' array.", "error");
          return;
        }
        if (password.length < 8) {
          setStatus(status, "Password must be at least 8 characters.", "error");
          return;
        }
        if (password !== confirm) {
          setStatus(status, "Passwords do not match.", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Encrypting…";
        setStatus(status, "Deriving key (this can take a few seconds on slower devices)…");

        try {
          // Re-stringify so the encrypted plaintext is canonical, not whatever
          // formatting the user pasted.
          const canonical = JSON.stringify(parsed);
          const envelope = await encrypt(canonical, password);
          output.value = JSON.stringify(envelope, null, 2);
          outputSection.classList.remove("hidden");
          setStatus(status, "Encrypted successfully. Download the file and commit it to your data repo.", "success");
        } catch (e) {
          setStatus(status, "Encryption failed: " + (e.message || e), "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Encrypt";
        }
      });

      $("download-btn").addEventListener("click", () => {
        const blob = new Blob([$("output").value], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "data.enc.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      $("copy-btn").addEventListener("click", async () => {
        const outputStatus = $("output-status");
        try {
          await navigator.clipboard.writeText($("output").value);
          setStatus(outputStatus, "Copied to clipboard.", "success");
        } catch (e) {
          // Fallback for older Safari / non-secure contexts.
          const ta = $("output");
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          try {
            document.execCommand("copy");
            setStatus(outputStatus, "Copied to clipboard.", "success");
          } catch (e2) {
            setStatus(outputStatus, "Couldn't copy automatically — select the text and copy manually.", "error");
          }
        }
      });
    </script>
  </body>
</html>
