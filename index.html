<!DOCTYPE html>
<html lang="en">
  <head>

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Family Flashcards</title>
    <link rel="stylesheet" href="styles.css" />
    <script

      <div class="screen quiz-screen" id="quiz-screen"></div>
      <div class="screen quiz-end-screen" id="quiz-end-screen"></div>
    </div>
  </body>
</html>
